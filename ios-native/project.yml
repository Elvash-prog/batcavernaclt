name: BatCaverna
options:
  bundleIdPrefix: dev.gamersclt
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '0.2.0'
    CURRENT_PROJECT_VERSION: '3'
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: BatCaverna
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.entertainment
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    TARGETED_DEVICE_FAMILY: '1,2'
targets:
  BatCaverna:
    type: application
    platform: iOS
    sources: [Sources, Resources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.gamersclt.batcaverna
  BatCavernaTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: BatCaverna
schemes:
  BatCaverna:
    build:
      targets:
        BatCaverna: all
    test:
      targets: [BatCavernaTests]
