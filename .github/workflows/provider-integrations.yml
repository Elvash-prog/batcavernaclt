name: Provider API controls
on:
  pull_request:
    paths: ['supabase/functions/**', 'supabase/migrations/20261029130000_provider_budgets_cache.sql', 'tests/provider-*.mjs', 'tests/bright-api-security.mjs', '.github/workflows/provider-integrations.yml', 'tools/operations/deploy_provider_integrations.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/provider-requests.mjs
      - run: node tests/bright-api-security.mjs && node tests/native-api.mjs
      - run: npm install --prefix /tmp/provider-sql @electric-sql/pglite@0.5.13 --no-audit --no-fund
      - run: node tests/provider-budgets-db.mjs
        env:
          PROVIDER_TEST_MODULE: file:///tmp/provider-sql/node_modules/@electric-sql/pglite/dist/index.js
  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb
        with:
          version: latest
      - name: Apply reviewed migration before deploying functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: python3 tools/operations/deploy_provider_integrations.py
      - name: Configure storefront metadata switch and deploy functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          STORE_METADATA: ${{ vars.STEAM_STORE_METADATA_ENABLED || 'true' }}
        run: |
          case "$STORE_METADATA" in true|false) ;; *) exit 1;; esac
          supabase secrets set --project-ref luoqlhgfmixvfqbfcdoc STEAM_STORE_METADATA_ENABLED="$STORE_METADATA"
          supabase functions deploy bright-api --project-ref luoqlhgfmixvfqbfcdoc --no-verify-jwt --use-api
          supabase functions deploy native-api --project-ref luoqlhgfmixvfqbfcdoc --no-verify-jwt --use-api
