name: Android visual
on:
  pull_request:
    paths: ['android-native/**', '.github/workflows/android-visual.yml']
  workflow_dispatch:
concurrency:
  group: android-visual-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  appearance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Permitir aceleração do emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Preparar build visual sem registro no Firebase
        run: rm android-native/app/google-services.json
      - name: Testar e capturar componentes nativos
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_7
          working-directory: android-native
          script: |
            mkdir -p build/mobile-previews
            bash gradlew :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon
            adb install -r -t app/build/outputs/apk/debug/app-debug.apk
            adb install -r -t app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w dev.gamersclt.batcaverna.nativeapp.preview.debug.test/androidx.test.runner.AndroidJUnitRunner > build/mobile-test-results.txt
            python3 -c "from pathlib import Path; s=Path('build/mobile-test-results.txt').read_text(); print(s); assert 'OK (1 test)' in s and 'FAILURES' not in s"
            adb exec-out run-as dev.gamersclt.batcaverna.nativeapp.preview.debug cat files/mobile-previews/login-android.png > build/mobile-previews/login-android.png
            adb exec-out run-as dev.gamersclt.batcaverna.nativeapp.preview.debug cat files/mobile-previews/controles-android.png > build/mobile-previews/controles-android.png
            adb exec-out run-as dev.gamersclt.batcaverna.nativeapp.preview.debug cat files/mobile-previews/navegacao-retro-android.png > build/mobile-previews/navegacao-retro-android.png
            python3 -c "from pathlib import Path; files=list(Path('build/mobile-previews').glob('*.png')); assert len(files)==3 and all(p.read_bytes().startswith(bytes([137,80,78,71,13,10,26,10])) for p in files)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-mobile-previews
          path: |
            android-native/build/mobile-previews/
            android-native/build/mobile-test-results.txt
