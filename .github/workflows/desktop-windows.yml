name: Gerar programa Windows EXE
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Instalar dependências desktop
        working-directory: desktop
        run: npm install
      - name: Verificar adaptação desktop
        working-directory: desktop
        run: npm run prepare:ui && npm test
      - name: Instalar dependências dos testes existentes
        working-directory: tests
        run: npm install
      - name: Testes existentes
        shell: pwsh
        run: |
          Get-ChildItem tests/*.mjs | ForEach-Object {
            node $_.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Testes Rust
        working-directory: desktop/src-tauri
        run: cargo test
      - name: Compilar instalador EXE
        working-directory: desktop
        run: npm run build
      - name: Disponibilizar instalador e locks da compilação
        uses: actions/upload-artifact@v4
        with:
          name: BatCaverna-CLT-Windows-EXE
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
            desktop/package-lock.json
            desktop/src-tauri/Cargo.lock
          if-no-files-found: error
