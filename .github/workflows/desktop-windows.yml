name: Gerar programa Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-windows.yml"
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Instalar dependências desktop
        working-directory: desktop
        run: npm install
      - name: Verificar interface desktop
        working-directory: desktop
        run: npm test
      - name: Testes Rust
        working-directory: desktop/src-tauri
        run: cargo test
      - name: Compilar instalador EXE
        working-directory: desktop
        run: npm run build
      - name: Disponibilizar instalador
        uses: actions/upload-artifact@v4
        with:
          name: BatCaverna-CLT-Windows-EXE
          path: desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
