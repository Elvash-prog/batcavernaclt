name: Gerar programa Windows EXE
on:
  workflow_dispatch:
  pull_request:
    paths: ["desktop/**", ".github/workflows/desktop-windows.yml"]
  push:
    branches: [main, codex/windows-0.6.0]
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-windows.yml"
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Instalar dependÃªncias desktop
        working-directory: desktop
        run: npm install
      - name: Verificar interface desktop
        working-directory: desktop
        run: npm test
      - name: Instalar navegador de teste
        working-directory: desktop
        run: npx playwright install chromium
      - name: Validar fluxos da interface
        id: ui_smoke
        continue-on-error: true
        working-directory: desktop
        shell: bash
        run: set -o pipefail; npm run test:ui 2>&1 | tee ui-smoke.log
      - name: Publicar log da interface
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-ui-smoke-log
          path: desktop/ui-smoke.log
      - name: Exigir validaÃ§Ã£o da interface
        if: steps.ui_smoke.outcome != 'success'
        run: exit 1
      - name: Disponibilizar prÃ©vias da interface
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BatCaverna-CLT-Windows-Previews
          path: desktop/preview/*.png
          if-no-files-found: error
      - name: Testes Rust
        working-directory: desktop/src-tauri
        run: cargo test --release
      - name: Compilar instalador EXE
        working-directory: desktop
        run: npm run build
      - name: Smoke test do Tauri real
        shell: pwsh
        working-directory: desktop
        run: |
          $log = Join-Path $PWD "tauri-smoke.log"
          $env:BATCAVERNA_SMOKE_LOG = $log
          $exe = Join-Path $PWD "src-tauri/target/release/batcaverna-clt-desktop.exe"
          if (!(Test-Path $exe)) { throw "ExecutÃ¡vel Tauri nÃ£o encontrado: $exe" }
          $process = Start-Process -FilePath $exe -PassThru
          try {
            $ready = $false
            $deadline = (Get-Date).AddSeconds(50)
            do {
              Start-Sleep -Seconds 1
              $process.Refresh()
              if ($process.HasExited) { throw "O Tauri encerrou antes de inicializar (cÃ³digo $($process.ExitCode))." }
              if (Test-Path $log) {
                $content = Get-Content $log -Raw
                if ($content -match "BOOT_FAILURE") { throw "A interface Tauri registrou falha de boot.`n$content" }
                if ($content -match "BOOT_READY") { $ready = $true; break }
              }
            } while ((Get-Date) -lt $deadline)
            if (!$ready) { $content = if (Test-Path $log) { Get-Content $log -Raw } else { "log ausente" }; throw "A interface Tauri nÃ£o confirmou o boot em 50 segundos.`n$content" }
