name: Segurança e recuperação beta
on:
  pull_request:
    paths: ['tools/operations/**', 'tests/operations/**', 'tests/operational-metrics.mjs', 'supabase/migrations/**', 'supabase/functions/_shared/**', '.github/workflows/beta-readiness.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recovery:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: synthetic-ci-password
          POSTGRES_DB: beta_source
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      PG_CONTAINER: ${{ job.services.postgres.id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/operational-metrics.mjs tests/catalog-cache.mjs tests/igdb.mjs tests/native-api.mjs tests/bright-api-security.mjs tests/native-dependencies.mjs
      - name: Verificar criptografia e integridade com dados sintéticos
        run: python3 -m unittest discover -s tools/operations -p 'test_*.py' -v
      - name: Aplicar esquema isolado e validar permissões
        run: |
          docker exec -i "$PG_CONTAINER" psql -U postgres -d beta_source -v ON_ERROR_STOP=1 < tests/operations/fixture.sql
          docker exec -i "$PG_CONTAINER" psql -U postgres -d beta_source -v ON_ERROR_STOP=1 < supabase/migrations/20261018182205_persistent_catalog_and_account_layout.sql
          for migration in supabase/migrations/*beta_security_and_operational_readiness.sql; do
            docker exec -i "$PG_CONTAINER" psql -U postgres -d beta_source -v ON_ERROR_STOP=1 < "$migration"
          done
          docker exec -i "$PG_CONTAINER" psql -U postgres -d beta_source -v ON_ERROR_STOP=1 < tests/operations/assertions.sql
      - name: Exportar e restaurar somente o banco sintético
        run: |
          docker exec "$PG_CONTAINER" pg_dump -U postgres -Fc --no-owner beta_source > "$RUNNER_TEMP/beta-fixture.dump"
          docker exec "$PG_CONTAINER" createdb -U postgres beta_restored
          docker exec -i "$PG_CONTAINER" pg_restore -U postgres --exit-on-error --no-owner -d beta_restored < "$RUNNER_TEMP/beta-fixture.dump"
          docker exec -i "$PG_CONTAINER" psql -U postgres -d beta_restored -v ON_ERROR_STOP=1 < tests/operations/assertions.sql
