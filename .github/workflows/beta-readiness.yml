name: Segurança e recuperação beta
on:
  pull_request:
    paths: ['tools/operations/**', 'tests/operations/**', 'tests/operational-metrics.mjs', 'supabase/migrations/**', 'supabase/functions/_shared/**', 'supabase/functions/native-api/**', 'tests/media-errors.mjs', 'tests/image-validation.mjs', 'tests/profile-highlights.mjs', '.github/workflows/beta-readiness.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-rehearsal:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Instalar parser SQL fixado
        run: python -m pip install --disable-pip-version-check -r tools/operations/requirements-recovery.txt
      - name: Validar coordenador e sintaxe PowerShell sem restaurar dados
        run: python -m unittest discover -s tools/operations -p 'test_monthly_rehearsal.py' -v
  recovery:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: synthetic-ci-password
          POSTGRES_DB: beta_source
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/api-keys.mjs tests/operational-metrics.mjs tests/security-events.mjs tests/catalog-cache.mjs tests/igdb.mjs tests/native-api.mjs tests/bright-api-security.mjs tests/native-dependencies.mjs tests/media-errors.mjs tests/image-validation.mjs
      - name: Instalar dependências do banco de teste isolado
        run: npm install --prefix tests --ignore-scripts --no-package-lock --no-audit --no-fund
      - name: Validar seleção de destaques e preservação do rascunho
        run: node tests/profile-highlights.mjs
      - name: Validar entradas de perfil em PostgreSQL isolado
        run: node tests/profile-validation.mjs
      - name: Instalar parser SQL do plano local
        run: python3 -m pip install --disable-pip-version-check -r tools/operations/requirements-recovery.txt
      - name: Verificar criptografia e integridade com dados sintéticos
        env:
          STORAGE_TEST_IMAGE: public.ecr.aws/supabase/storage-api:v1.84.19
          GOTRUE_TEST_IMAGE: public.ecr.aws/supabase/gotrue:v2.185.0
        run: python3 -m unittest discover -s tools/operations -p 'test_*.py' -v
      - name: Aplicar esquema isolado e validar permissões
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec -i "$PG_CONTAINER" psql -U postgres -d beta_source -v ON_ERROR_STOP=1 < tests/operations/fixture.sql
          docker exec -i "$PG_CONTAINER" psql -U postgres -d beta_source -v ON_ERROR_STOP=1 < supabase/migrations/20261018182205_persistent_catalog_and_account_layout.sql
          for migration in supabase/migrations/*beta_security_and_operational_readiness.sql; do
            docker exec -i "$PG_CONTAINER" psql -U postgres -d beta_source -v ON_ERROR_STOP=1 < "$migration"
          done
          for migration in supabase/migrations/*harden_people_search.sql; do
            docker exec -i "$PG_CONTAINER" psql -U postgres -d beta_source -v ON_ERROR_STOP=1 < "$migration"
          done
          for migration in supabase/migrations/*login_rate_limits.sql; do
            docker exec -i "$PG_CONTAINER" psql -U postgres -d beta_source -v ON_ERROR_STOP=1 < "$migration"
          done
          docker exec -i "$PG_CONTAINER" psql -U postgres -d beta_source -v ON_ERROR_STOP=1 < tests/operations/login-rate.sql
          docker exec -i "$PG_CONTAINER" psql -U postgres -d beta_source -v ON_ERROR_STOP=1 < tests/operations/assertions.sql
      - name: Exportar e restaurar somente o banco sintético
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$PG_CONTAINER" pg_dump -U postgres -Fc --no-owner beta_source > "$RUNNER_TEMP/beta-fixture.dump"
          docker exec "$PG_CONTAINER" createdb -U postgres beta_restored
          docker exec -i "$PG_CONTAINER" pg_restore -U postgres --exit-on-error --no-owner -d beta_restored < "$RUNNER_TEMP/beta-fixture.dump"
          docker exec -i "$PG_CONTAINER" psql -U postgres -d beta_restored -v ON_ERROR_STOP=1 < tests/operations/assertions.sql
