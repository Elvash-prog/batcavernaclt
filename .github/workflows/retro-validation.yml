name: Retro Steam validation
on:
  push:
    branches: [codex/retro-steam-0.17.36, codex/desktop-0.17.37-fixes, codex/desktop-0.17.38-fixes]
  pull_request:
    paths: ['desktop/**', 'supabase/functions/**', 'tests/**', 'public/privacidade.html', 'public/marketing/privacy.css', 'worker.js']
permissions:
  contents: read
jobs:
  interface:
    # Playwright 1.58.2 supports this image; ubuntu-latest now resolves to 26.04.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node tests/native-dependencies.mjs
      - run: node --test tests/https-security.mjs
      - run: node --test tests/catalog-cache.mjs tests/operational-metrics.mjs tests/security-events.mjs
      - run: node tests/igdb.mjs
      - run: node tests/native-api.mjs
      - run: node tests/request-security.mjs && node tests/login-rate.mjs && node tests/edge-pentest.mjs
      - run: node tests/bright-api-security.mjs
      - run: npm ci
        working-directory: desktop
      - run: npm test
        working-directory: desktop
      - run: npx playwright install --with-deps chromium
        working-directory: desktop
      - run: node tests/pentest-rendering.mjs
      - run: npm run test:ui
        working-directory: desktop
      - run: node tests/privacy-ui.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Retro-Steam-UI-validation
          path: desktop/preview/
