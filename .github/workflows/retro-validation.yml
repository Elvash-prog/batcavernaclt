name: Retro Steam validation
on:
  push:
    branches: [codex/retro-steam-0.17.36, codex/desktop-0.17.37-fixes, codex/desktop-0.17.38-fixes]
  pull_request:
    paths: ['desktop/**', 'supabase/functions/bright-api/**', 'tests/bright-api-security.mjs']
permissions:
  contents: read
jobs:
  interface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node tests/bright-api-security.mjs
      - run: npm ci
        working-directory: desktop
      - run: npm test
        working-directory: desktop
      - run: npx playwright install --with-deps chromium
        working-directory: desktop
      - run: npm run test:ui
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Retro-Steam-UI-validation
          path: desktop/preview/
