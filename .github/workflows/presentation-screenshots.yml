name: Capturas de apresentação
on:
  pull_request:
    paths: ['tools/presentation/**', '.github/workflows/presentation-screenshots.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
        working-directory: desktop
      - run: npm run build:web
        working-directory: desktop
      - run: npx playwright install --with-deps chromium
        working-directory: desktop
      - run: node tools/presentation/screenshots.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BatCaverna-apresentacao
          path: desktop/preview/apresentacao-*.png
