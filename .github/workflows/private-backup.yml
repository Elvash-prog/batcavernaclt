name: Backup privado Supabase
on:
  pull_request:
    paths: ['tools/operations/**', '.github/workflows/private-backup.yml', 'docs/BACKUP-SAO-PAULO.md', 'docs/BACKUP-B2.md']
  workflow_dispatch:
    inputs:
      mode:
        description: Conferir acesso ou gerar a copia criptografada
        type: choice
        default: check
        options: [check, backup]
      verify_b2_download:
        description: Conferir download completo do B2 (consome transferencia)
        type: boolean
        default: false
  schedule:
    - cron: '17 6 * * *'
permissions:
  contents: read
concurrency:
  group: private-supabase-backup
  cancel-in-progress: false
jobs:
  validate:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || vars.BACKUP_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Testar integridade, criptografia e destinos com dados sinteticos
        run: python3 -m unittest discover -s tools/operations -p 'test_*.py' -v
      - name: Validar template AWS sem criar recursos
        if: github.event_name == 'pull_request'
        run: |
          python3 -m pip install --disable-pip-version-check cfn-lint==1.59.0
          cfn-lint tools/operations/backup-s3-stack.json
  backup:
    permissions:
      contents: read
      id-token: write
    needs: validate
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name == 'workflow_dispatch' || vars.BACKUP_AUTOMATION_ENABLED == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: 2.122.0
      - name: Conferir configuracao sem exibir valores
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          BATCAVERNA_BACKUP_SERVICE_KEY: ${{ secrets.BATCAVERNA_BACKUP_SERVICE_KEY }}
          BACKUP_GPG_PUBLIC_KEY: ${{ secrets.BACKUP_GPG_PUBLIC_KEY }}
        run: |
          python3 - <<'PY'
          import os, pathlib
          required = ['SUPABASE_ACCESS_TOKEN', 'SUPABASE_DB_PASSWORD', 'BATCAVERNA_BACKUP_SERVICE_KEY', 'BACKUP_GPG_PUBLIC_KEY']
          missing = [name for name in required if not os.environ.get(name, '').strip()]
          if missing:
              raise SystemExit('Secrets ausentes: ' + ', '.join(missing))
          if not os.environ['BATCAVERNA_BACKUP_SERVICE_KEY'].strip().startswith('sb_secret_'):
              raise SystemExit('O backup exige uma chave moderna sb_secret_.')
          key = os.environ['BACKUP_GPG_PUBLIC_KEY'].strip()
          if not key.startswith('-----BEGIN PGP PUBLIC KEY BLOCK-----') or 'PRIVATE KEY BLOCK' in key:
              raise SystemExit('Cadastrar somente a chave publica do GPG.')
          folder = pathlib.Path(os.environ['RUNNER_TEMP']) / 'batcaverna-backup'
          folder.mkdir(mode=0o700)
          (folder / 'tmp').mkdir(mode=0o700)
          (folder / 'public.asc').write_text(key, encoding='utf-8')
          print('Configuracao presente; valores nao exibidos.')
          PY
      - name: Autenticar a conta de servico do Drive
        id: drive-auth
        continue-on-error: ${{ vars.BACKUP_B2_ENABLED == 'true' || vars.BACKUP_S3_ENABLED == 'true' }}
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          credentials_json: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/drive
          create_credentials_file: false
          export_environment_variables: false
      - name: Conferir a pasta privada e as sete reservas
        id: drive-check
        if: steps.drive-auth.outcome == 'success'
        continue-on-error: ${{ vars.BACKUP_B2_ENABLED == 'true' || vars.BACKUP_S3_ENABLED == 'true' }}
        env:
          GDRIVE_ACCESS_TOKEN: ${{ steps.drive-auth.outputs.access_token }}
        run: python3 tools/operations/drive_backup.py --check-only
      - name: Vincular CLI somente para exportacao
        if: >-
          (github.event_name == 'schedule' || inputs.mode == 'backup') &&
          (steps.drive-check.outcome == 'success' || vars.BACKUP_B2_ENABLED == 'true' || vars.BACKUP_S3_ENABLED == 'true')
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          python3 - <<'PY'
          import subprocess
          result = subprocess.run(['supabase', 'link', '--project-ref', 'luoqlhgfmixvfqbfcdoc'], capture_output=True)
          if result.returncode:
              raise SystemExit('Falha ao vincular CLI; conferir permissoes do token e senha do banco. Saida remota omitida.')
          print('CLI vinculado ao projeto esperado.')
          PY
      - name: Exportar e criptografar com a chave publica
        id: export-backup
        if: >-
          (github.event_name == 'schedule' || inputs.mode == 'backup') &&
          (steps.drive-check.outcome == 'success' || vars.BACKUP_B2_ENABLED == 'true' || vars.BACKUP_S3_ENABLED == 'true')
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          BATCAVERNA_BACKUP_SERVICE_KEY: ${{ secrets.BATCAVERNA_BACKUP_SERVICE_KEY }}
          TMPDIR: ${{ runner.temp }}/batcaverna-backup/tmp
        run: >-
          python3 tools/operations/backup.py
          --recipient-file "$RUNNER_TEMP/batcaverna-backup/public.asc"
          --output "$RUNNER_TEMP/batcaverna-backup/BatCaverna.tar.gz.gpg"
      - name: Atualizar uma reserva e verificar o download criptografado
        id: drive-backup
        if: >-
          !cancelled() && steps.export-backup.outcome == 'success' &&
          steps.drive-auth.outcome == 'success' && steps.drive-check.outcome == 'success'
        env:
          GDRIVE_ACCESS_TOKEN: ${{ steps.drive-auth.outputs.access_token }}
        run: >-
          python3 tools/operations/drive_backup.py
          --archive "$RUNNER_TEMP/batcaverna-backup/BatCaverna.tar.gz.gpg"
      - name: Conferir e atualizar a segunda copia privada no Backblaze B2
        id: b2-backup
        if: >-
          !cancelled() && vars.BACKUP_B2_ENABLED == 'true' &&
          (steps.export-backup.outcome == 'success' || inputs.mode == 'check')
        env:
          B2_BACKUP_KEY_ID: ${{ secrets.B2_BACKUP_KEY_ID }}
          B2_BACKUP_APPLICATION_KEY: ${{ secrets.B2_BACKUP_APPLICATION_KEY }}
          BACKUP_B2_BUCKET_ID: ${{ vars.BACKUP_B2_BUCKET_ID }}
          BACKUP_B2_BUCKET_NAME: ${{ vars.BACKUP_B2_BUCKET_NAME }}
          BACKUP_B2_REGION: ${{ vars.BACKUP_B2_REGION }}
          BACKUP_B2_CAPS_CONFIRMED: ${{ vars.BACKUP_B2_CAPS_CONFIRMED }}
          BACKUP_MODE: ${{ inputs.mode || 'backup' }}
          VERIFY_DOWNLOAD: ${{ inputs.verify_b2_download && 'true' || 'false' }}
        run: |
          if [ "$BACKUP_MODE" = 'check' ]; then
            python3 tools/operations/b2_backup.py --check-only
          else
            args=(--archive "$RUNNER_TEMP/batcaverna-backup/BatCaverna.tar.gz.gpg")
            if [ "$VERIFY_DOWNLOAD" = 'true' ]; then args+=(--verify-download); fi
            python3 tools/operations/b2_backup.py "${args[@]}"
          fi
      # Optional until the owner creates the AWS account and validates recovery.
      # Runs after Drive, so an S3 failure does not prevent the existing Drive copy.
      - name: Validar parametros do destino S3
        id: s3-config
        if: >-
          !cancelled() && vars.BACKUP_S3_ENABLED == 'true' &&
          (steps.export-backup.outcome == 'success' || inputs.mode == 'check')
        env:
          BACKUP_S3_BUCKET: ${{ vars.BACKUP_S3_BUCKET }}
          BACKUP_AWS_ACCOUNT_ID: ${{ vars.BACKUP_AWS_ACCOUNT_ID }}
          BACKUP_AWS_ROLE_ARN: ${{ vars.BACKUP_AWS_ROLE_ARN }}
        run: |
          python3 - <<'PYCONFIG'
          import os, re, sys
          sys.path.insert(0,'tools/operations')
          from s3_backup import Aws
          account=os.environ.get('BACKUP_AWS_ACCOUNT_ID','')
          Aws(os.environ.get('BACKUP_S3_BUCKET',''),account)
          if not re.fullmatch('arn:aws:iam::'+account+r':role/[A-Za-z0-9+=,.@_/-]{1,512}',os.environ.get('BACKUP_AWS_ROLE_ARN','')):
              raise SystemExit('Configure a role de backup gerada pelo CloudFormation na mesma conta do bucket.')
          print('Destino S3 configurado; identidade temporaria ainda sera conferida.')
          PYCONFIG
      - name: Conectar AWS por identidade temporaria
        id: aws-auth
        if: >-
          !cancelled() && vars.BACKUP_S3_ENABLED == 'true' &&
          steps.s3-config.outcome == 'success'
        uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c # v4
        with:
          aws-region: sa-east-1
          role-to-assume: ${{ vars.BACKUP_AWS_ROLE_ARN }}
          allowed-account-ids: ${{ vars.BACKUP_AWS_ACCOUNT_ID }}
          role-duration-seconds: 3600
          role-session-name: batcaverna-backup-${{ github.run_id }}
          unset-current-credentials: true
      - name: Conferir bucket privado e copiar pacote criptografado para Sao Paulo
        id: s3-backup
        if: >-
          !cancelled() && vars.BACKUP_S3_ENABLED == 'true' &&
          steps.aws-auth.outcome == 'success' &&
          (steps.export-backup.outcome == 'success' || inputs.mode == 'check')
        env:
          BACKUP_S3_BUCKET: ${{ vars.BACKUP_S3_BUCKET }}
          BACKUP_AWS_ACCOUNT_ID: ${{ vars.BACKUP_AWS_ACCOUNT_ID }}
          BACKUP_MODE: ${{ inputs.mode || 'backup' }}
        run: |
          if [ "$BACKUP_MODE" = 'check' ]; then
            python3 tools/operations/s3_backup.py --check-only
          else
            python3 tools/operations/s3_backup.py --archive "$RUNNER_TEMP/batcaverna-backup/BatCaverna.tar.gz.gpg"
          fi
      - name: Registrar resultado de cada destino
        if: always()
        env:
          BACKUP_MODE: ${{ inputs.mode || 'backup' }}
          DRIVE_CHECK: ${{ steps.drive-check.outcome }}
          DRIVE_COPY: ${{ steps.drive-backup.outcome }}
          B2_RESULT: ${{ steps.b2-backup.outcome }}
          S3_RESULT: ${{ steps.s3-backup.outcome }}
        run: |
          python3 - <<'PYREPORT'
          import os
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('Modo: '+os.environ['BACKUP_MODE']+'\n\n')
              for label,key in [('Drive (acesso)','DRIVE_CHECK'),('Drive (copia)','DRIVE_COPY'),('Backblaze B2','B2_RESULT'),('AWS S3 opcional','S3_RESULT')]:
                  f.write('- '+label+': '+(os.environ.get(key) or 'skipped')+'\n')
              f.write('\nB2 confirma checksum do envio diariamente; download completo somente se solicitado. Descriptografia e restauracao exigem ensaio separado.\n')
          PYREPORT
      - name: Exigir sucesso dos destinos habilitados
        if: '!cancelled()'
        env:
          BACKUP_MODE: ${{ inputs.mode || 'backup' }}
          DRIVE_CHECK: ${{ steps.drive-check.outcome }}
          DRIVE_COPY: ${{ steps.drive-backup.outcome }}
          EXPORT_RESULT: ${{ steps.export-backup.outcome }}
          B2_ENABLED: ${{ vars.BACKUP_B2_ENABLED }}
          B2_RESULT: ${{ steps.b2-backup.outcome }}
          S3_ENABLED: ${{ vars.BACKUP_S3_ENABLED }}
          S3_RESULT: ${{ steps.s3-backup.outcome }}
        run: |
          python3 - <<'PYRESULT'
          import os
          required=['DRIVE_CHECK']
          if os.environ['BACKUP_MODE']=='backup': required+=['DRIVE_COPY','EXPORT_RESULT']
          if os.environ.get('B2_ENABLED')=='true': required+=['B2_RESULT']
          if os.environ.get('S3_ENABLED')=='true': required+=['S3_RESULT']
          if any(os.environ.get(k)!='success' for k in required):
              raise SystemExit('Ao menos uma etapa falhou. Confira o resultado de cada destino; uma copia ja concluida no outro destino foi preservada.')
          print('Destinos habilitados conferidos; consulte os tipos de verificacao no resumo.')
          PYRESULT
      - name: Limpar arquivos temporarios
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/batcaverna-backup"
