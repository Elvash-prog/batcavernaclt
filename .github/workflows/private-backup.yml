name: Backup privado Supabase
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Conferir acesso ou gerar a copia criptografada
        type: choice
        default: check
        options: [check, backup]
  schedule:
    - cron: '17 6 * * *'
permissions:
  contents: read
concurrency:
  group: private-supabase-backup
  cancel-in-progress: false
jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' || vars.BACKUP_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Testar integridade, criptografia e seguranca do Drive com dados sinteticos
        run: python3 -m unittest discover -s tools/operations -p 'test_*.py' -v
  backup:
    needs: validate
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name == 'workflow_dispatch' || vars.BACKUP_AUTOMATION_ENABLED == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: 2.122.0
      - name: Conferir configuracao sem exibir valores
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          BATCAVERNA_BACKUP_SERVICE_KEY: ${{ secrets.BATCAVERNA_BACKUP_SERVICE_KEY }}
          BACKUP_GPG_PUBLIC_KEY: ${{ secrets.BACKUP_GPG_PUBLIC_KEY }}
        run: |
          python3 - <<'PY'
          import os, pathlib
          required = ['SUPABASE_ACCESS_TOKEN', 'SUPABASE_DB_PASSWORD', 'BATCAVERNA_BACKUP_SERVICE_KEY', 'BACKUP_GPG_PUBLIC_KEY']
          missing = [name for name in required if not os.environ.get(name, '').strip()]
          if missing:
              raise SystemExit('Secrets ausentes: ' + ', '.join(missing))
          if not os.environ['BATCAVERNA_BACKUP_SERVICE_KEY'].strip().startswith('sb_secret_'):
              raise SystemExit('O backup exige uma chave moderna sb_secret_.')
          key = os.environ['BACKUP_GPG_PUBLIC_KEY'].strip()
          if not key.startswith('-----BEGIN PGP PUBLIC KEY BLOCK-----') or 'PRIVATE KEY BLOCK' in key:
              raise SystemExit('Cadastrar somente a chave publica do GPG.')
          folder = pathlib.Path(os.environ['RUNNER_TEMP']) / 'batcaverna-backup'
          folder.mkdir(mode=0o700)
          (folder / 'tmp').mkdir(mode=0o700)
          (folder / 'public.asc').write_text(key, encoding='utf-8')
          print('Configuracao presente; valores nao exibidos.')
          PY
      - name: Autenticar a conta de servico do Drive
        id: drive-auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          credentials_json: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/drive
          create_credentials_file: false
          export_environment_variables: false
      - name: Conferir a pasta privada e as sete reservas
        env:
          GDRIVE_ACCESS_TOKEN: ${{ steps.drive-auth.outputs.access_token }}
        run: python3 tools/operations/drive_backup.py --check-only
      - name: Vincular CLI somente para exportacao
        if: github.event_name == 'schedule' || inputs.mode == 'backup'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          python3 - <<'PY'
          import subprocess
          result = subprocess.run(['supabase', 'link', '--project-ref', 'luoqlhgfmixvfqbfcdoc'], capture_output=True)
          if result.returncode:
              raise SystemExit('Falha ao vincular CLI; conferir permissoes do token e senha do banco. Saida remota omitida.')
          print('CLI vinculado ao projeto esperado.')
          PY
      - name: Exportar e criptografar com a chave publica
        if: github.event_name == 'schedule' || inputs.mode == 'backup'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          BATCAVERNA_BACKUP_SERVICE_KEY: ${{ secrets.BATCAVERNA_BACKUP_SERVICE_KEY }}
          TMPDIR: ${{ runner.temp }}/batcaverna-backup/tmp
        run: >-
          python3 tools/operations/backup.py
          --recipient-file "$RUNNER_TEMP/batcaverna-backup/public.asc"
          --output "$RUNNER_TEMP/batcaverna-backup/BatCaverna.tar.gz.gpg"
      - name: Atualizar uma reserva e verificar o download criptografado
        if: github.event_name == 'schedule' || inputs.mode == 'backup'
        env:
          GDRIVE_ACCESS_TOKEN: ${{ steps.drive-auth.outputs.access_token }}
        run: >-
          python3 tools/operations/drive_backup.py
          --archive "$RUNNER_TEMP/batcaverna-backup/BatCaverna.tar.gz.gpg"
      - name: Registrar resultado
        if: success()
        run: |
          echo 'Configuracao e destino privado conferidos. Se executado no modo backup, conferir acima a confirmacao de download_verified. A descriptografia deve ser validada pelo responsavel, fora do GitHub.' >> "$GITHUB_STEP_SUMMARY"
      - name: Registrar falha sem detalhes internos
        if: failure()
        run: |
          echo '::error::Backup privado nao concluido. Verifique a etapa que falhou; nao considere esta execucao uma copia valida.'
          echo 'Falha no fluxo de backup privado. A agenda nao substitui a verificacao de recuperacao nem o monitoramento de execucoes ausentes.' >> "$GITHUB_STEP_SUMMARY"
      - name: Limpar arquivos temporarios
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/batcaverna-backup"
