name: Local Steam achievements
on:
  pull_request:
    paths:
      - 'desktop/src-tauri/src/steam_local.rs'
      - 'desktop/src-tauri/src/main.rs'
      - 'desktop/src/app.js'
      - 'desktop/src/redesign.js'
      - 'supabase/migrations/20261028130000_steam_local_achievements.sql'
      - 'tests/steam-local-achievements.mjs'
      - '.github/workflows/steam-local-achievements.yml'
      - 'tools/operations/deploy_steam_local_achievements.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-achievement-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node tests/steam-local-achievements.mjs
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path desktop/src-tauri/Cargo.toml steam_local
  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: local-achievement-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb
        with:
          version: latest
      - name: Apply reviewed local achievement migration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: python3 tools/operations/deploy_steam_local_achievements.py
