name: iOS nativo
on:
  pull_request:
    paths: ['ios-native/**', '.github/workflows/ios-native.yml']
  push:
    branches: [main]
    paths: ['ios-native/**', '.github/workflows/ios-native.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Preparar projeto Xcode
        working-directory: ios-native
        run: |
          brew install xcodegen
          python3 prepare-assets.py
          xcodegen generate
      - name: Selecionar simulador disponível
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for k,v in d["devices"].items() if "iOS" in k for x in v if "iPhone" in x["name"]))')
          echo "IOS_SIMULATOR_ID=$DEVICE" >> "$GITHUB_ENV"
      - name: Iniciar simulador antes dos testes
        timeout-minutes: 4
        run: |
          xcrun simctl boot "$IOS_SIMULATOR_ID" || true
          xcrun simctl bootstatus "$IOS_SIMULATOR_ID" -b
      - name: Compilar e testar sem assinatura de distribuição
        working-directory: ios-native
        run: xcodebuild -project BatCaverna.xcodeproj -scheme BatCaverna -destination "platform=iOS Simulator,id=$IOS_SIMULATOR_ID" -derivedDataPath build -resultBundlePath TestResults.xcresult CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- -parallel-testing-enabled NO test
      - name: Abrir aplicativo e capturar tela inicial
        timeout-minutes: 3
        working-directory: ios-native
        run: |
          xcrun simctl install "$IOS_SIMULATOR_ID" build/Build/Products/Debug-iphonesimulator/BatCaverna.app
          xcrun simctl launch "$IOS_SIMULATOR_ID" dev.gamersclt.batcaverna
          sleep 3
          xcrun simctl io "$IOS_SIMULATOR_ID" screenshot login-ios.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BatCaverna-iOS-simulador
          path: |
            ios-native/TestResults.xcresult
            ios-native/login-ios.png
            ios-native/build/Build/Products/Debug-iphonesimulator/BatCaverna.app
