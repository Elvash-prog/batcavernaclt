name: Windows 0.17.57 installed tray validation
on:
  workflow_dispatch:
  push:
    branches: ['codex/windows-tray-proof-0.17.57']
permissions:
  contents: read
jobs:
  installed-tray:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install published Windows 0.17.57
        shell: pwsh
        run: |
          $url = 'https://github.com/Elvash-prog/batcavernaclt/releases/download/desktop-v0.17.57/BatCaverna-CLT-Windows-setup.exe'
          $target = Join-Path $env:RUNNER_TEMP 'BatCaverna-setup.exe'
          Invoke-WebRequest $url -OutFile $target
          $process = Start-Process $target -ArgumentList '/S' -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw 'A instalação silenciosa falhou.' }
      - name: Check installed hidden launch and manual restore
        shell: pwsh
        working-directory: desktop
        run: |
          $entry = Get-ChildItem 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall' | Get-ItemProperty | Where-Object { $_.DisplayName -eq 'BatCaverna CLT' } | Select-Object -First 1
          if (!$entry.InstallLocation) { throw 'Pasta do aplicativo instalado não encontrada.' }
          $exe = Join-Path $entry.InstallLocation.Trim('"') 'batcaverna-clt-desktop.exe'
          ./scripts/test-tray-startup.ps1 -ExecutablePath $exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Installed-tray-validation
          path: desktop/tauri-tray-smoke.log
          if-no-files-found: warn
