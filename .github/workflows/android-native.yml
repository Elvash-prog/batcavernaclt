name: Android nativo
on:
  push:
    branches: [main, codex/android-1.3.0, release-desktop-0.17.36, codex/retro-steam-0.17.36, codex/desktop-0.17.38-fixes]
    paths: ['android-native/**', '.github/workflows/android-native.yml']
  pull_request:
    paths: ['android-native/**', '.github/workflows/android-native.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: android-native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"'
      - name: Validar integração IGDB e API nativa
        working-directory: .
        run: node tests/igdb.mjs && node tests/native-api.mjs
      - name: Testes Java de políticas
        run: |
          python3 - <<'PY'
          import pathlib, re, subprocess
          files = sorted(pathlib.Path('tests').glob('*.java'))
          subprocess.run(['javac', '-d', 'build/policy-tests', '-sourcepath', 'app/src/main/java'] + [str(p) for p in files], check=True)
          for p in files:
              match = re.search(r'^package\s+([\w.]+);', p.read_text(), re.M)
              name = (match.group(1) + '.' if match else '') + p.stem
              subprocess.run(['java', '-cp', 'build/policy-tests', name], check=True)
          PY
      - name: Testes, compilação e Android Lint
        run: bash gradlew :app:testReleaseUnitTest :app:assembleRelease :app:lintRelease --no-daemon
      - name: Identificar versão
        id: version
        shell: bash
        run: |
          VERSION=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle)
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Validar segredos de assinatura
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
      - name: Assinar e verificar APK de produção
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p build/signing build/signed
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > build/signing/batcaverna.keystore
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks build/signing/batcaverna.keystore \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out "build/signed/BatCaverna-${{ steps.version.outputs.version }}.apk" \
            app/build/outputs/apk/release/app-release-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs \
            "build/signed/BatCaverna-${{ steps.version.outputs.version }}.apk"
      - name: Gerar feed de atualização Android
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          python3 scripts/prepare-update.py \
            "build/signed/BatCaverna-${{ steps.version.outputs.version }}.apk" \
            --aapt "$ANDROID_HOME/build-tools/35.0.0/aapt" \
            --apksigner "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            --notes "release-notes-${{ steps.version.outputs.version }}.txt"
      - name: Preparar artefatos de diagnóstico
        run: |
          mkdir -p build/delivery
          cp app/build/outputs/apk/release/app-release-unsigned.apk build/delivery/BatCaverna-${{ steps.version.outputs.version }}-ci.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" build/delivery/
          cp "$ANDROID_HOME/build-tools/35.0.0/aapt" build/delivery/
      - name: Publicar build de diagnóstico
        uses: actions/upload-artifact@v4
        with:
          name: BatCaverna-Android-${{ steps.version.outputs.version }}-build
          path: android-native/build/delivery/
          retention-days: 30
      - name: Publicar release Android assinada
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ steps.version.outputs.version }}
          name: BatCaverna CLT Android ${{ steps.version.outputs.version }}
          body_path: android-native/release-notes-${{ steps.version.outputs.version }}.txt
          files: |
            android-native/build/update-release/BatCaverna-${{ steps.version.outputs.version }}.apk
            android-native/build/update-release/android-update.json
      - name: Autenticar no Google Drive
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.GDRIVE_UPLOAD_ENABLED == 'true'
        id: google-auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/drive
      - name: Atualizar APK no Google Drive
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.GDRIVE_UPLOAD_ENABLED == 'true'
        shell: bash
        env:
          GDRIVE_ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
          GDRIVE_APK_FILE_ID: ${{ vars.GDRIVE_APK_FILE_ID }}
          APK_VERSION: ${{ steps.version.outputs.version }}
        run: |
          test -n "$GDRIVE_ACCESS_TOKEN"
          test -n "$GDRIVE_APK_FILE_ID"
          APK="build/update-release/BatCaverna-${APK_VERSION}.apk"
          test -s "$APK"
          curl --fail-with-body --silent --show-error --retry 3 \
            -X PATCH \
            -H "Authorization: Bearer ${GDRIVE_ACCESS_TOKEN}" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary "@${APK}" \
            "https://www.googleapis.com/upload/drive/v3/files/${GDRIVE_APK_FILE_ID}?uploadType=media"
          curl --fail-with-body --silent --show-error --retry 3 \
            -X PATCH \
            -H "Authorization: Bearer ${GDRIVE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "{\"name\":\"BatCaverna-${APK_VERSION}.apk\"}" \
            "https://www.googleapis.com/drive/v3/files/${GDRIVE_APK_FILE_ID}?fields=id,name,size,modifiedTime"
      - name: Relatórios de validação
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-validation
          path: |
            android-native/app/build/reports/tests/
            android-native/app/build/reports/lint-results-release.html
